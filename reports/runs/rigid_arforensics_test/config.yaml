seed: 42
work_dir: outputs/rigid_arforensics

dataset:
  name: arforensics
  root: data/ARForensics

method:
  name: rigid
  backbone: dinov2_vitl14
  noise_std: 0.05
  n_repeat: 1

train:
  epochs: 0                 # training-free, 仅用于 eval.py 读取 amp/num_workers
  batch_size: 64
  lr: 0.0
  num_workers: 4
  amp: true

eval:
  batch_size: 64
